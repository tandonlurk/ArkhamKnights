workbook = "data/ArkhamKnights.xlsx"
draws = 100000
seed = 42

[spreads]
# 1 SD
yield_growth_2027 = 0.0345  # FY guidance misses, 2015-19, 2023-25
yield_growth_2028 = 0.0571  # 2-yr horizon
ncc_growth_2027   = 0.0264  # NCC ex-fuel guidance error
ncc_growth_2028   = 0.0402  # 2-yr horizon
fuel_price        = 120.80  # $/t, Brent vol
ats_2027          = 57.35   # $mm, 10-K, ex-capacity
discount          = 0.0     # within scenario spread
peer_multiple     = 0.0

[bounds]
discount_min = -0.10
discount_max = 0.50
peer_multiple_min = 3.0
fuel_price_min = 100.0

[downturn]
rho = 0.0  # factor loading

[downturn.direction]
yield_growth_2027 = -1
yield_growth_2028 = -1
ats_2027          = -1
discount          = 1
peer_multiple     = -1
ncc_growth_2027   = 0
ncc_growth_2028   = 0
fuel_price        = 0

[robustness]
spread_scales = [0.5, 1.0, 1.5, 2.0]
rhos = [0.0, 0.5]
draws = 100000

[convergence]
draw_counts = [1000, 10000, 100000, 1000000]
seeds = 20
